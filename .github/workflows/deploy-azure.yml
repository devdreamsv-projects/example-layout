name: Deploy to Azure Container Registry
run-name: ${{ github.actor }} is deploying a Docker image to Azure Container Registry 🚀
on: push
#  push:
#    branches: [develop]

env:
  IMAGE_NAME: todo-list

jobs: 
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: example-layout-env

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
        
      - name: Print secrets for debugging
        run: |
          echo "ACR_REGISTRY_LOGIN_SERVER: ${{ secrets.ACR_REGISTRY_LOGIN_SERVER }}"
          echo "ACR_REGISTRY_USERNAME: ${{ secrets.ACR_REGISTRY_USERNAME }}"
          echo "ACR_REGISTRY_PASSWORD: ${{ secrets.ACR_REGISTRY_PASSWORD }}"

      - name: Log in to Azure  Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ${{ secrets.ACR_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.ACR_REGISTRY_USERNAME }}
          password: ${{ secrets.ACR_REGISTRY_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}