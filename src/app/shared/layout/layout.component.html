<!-- Navbar -->
<nav class="navbar" aria-label="Top navigation">
	<span class="title">TodoList</span>
	<div class="greenting-container">
		<span class="greenting-text">Welcome back</span>
	</div>
	<div class="user-menu">
		<label class="inline-flex items-center gap-3 cursor-pointer">
			<input
				type="checkbox"
				class="sr-only"
				[checked]="isDarkMode()"
				(change)="toggleDarkMode($event)"
				aria-label="Activar modo oscuro"
			/>
			<span
					class="switch"
					[class.switch--on]="isDarkMode()"
					aria-hidden="true"
			></span>
			<span class="inline-flex items-center gap-2">
			@if (isDarkMode()) {
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="w-5 h-5 icon-moon"
					viewBox="0 0 24 24"
					fill="currentColor"
					aria-hidden="true"
				>
					<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
				</svg>
			} @else {
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="w-5 h-5 icon-sun"
					viewBox="0 0 24 24"
					fill="currentColor"
					aria-hidden="true"
				>
					<circle cx="12" cy="12" r="5" />
					<line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
					<line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
				</svg>
			}
			</span>
		</label>

		<button
			type="button"
			class="user-menu-button"
			aria-label="User menu"
		>
			U
		</button>
	</div>
</nav>

<div class="flex pt-14 min-h-screen">
	<!-- Sidebar -->
	<aside
		class="sidebar"
		aria-label="Main navigation"
	>
		<nav class="navigation-container" aria-label="Sidebar navigation">
			<a
				routerLink="/"
				routerLinkActive="option-active"
				[routerLinkActiveOptions]="{ exact: true }"
				class="option"
			>
				<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7m-9 5v6h4v-6m-4 0H9m6 0h-2" />
				</svg>
				Dashboard
			</a>
			<a
				routerLink="/tasks"
				routerLinkActive="option-active"
				class="option"
			>
				<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
				</svg>
				Tasks
			</a>
			<a
				routerLink="/settings"
				routerLinkActive="option-active"
				class="option"
			>
				<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
				</svg>
				Settings
			</a>
		</nav>
	</aside>

	<!-- Main content -->
	<main class="ml-55 flex-1 p-6">
		<router-outlet />
	</main>
</div>
